<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마꼼 구독 시작</title>
</head>
<body style="margin:0; padding:0; background:#f5f5f5; font-family:'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="500" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <!-- 헤더 -->
          <tr>
            <td style="background:#6366f1; padding:0;">
              <a href="https://maggom.com" target="_blank" rel="noopener noreferrer" style="display:block; padding:20px 40px; text-decoration:none; cursor:pointer;">
                <p style="margin:0; color:#ffffff; font-size:20px; font-weight:700; letter-spacing:-0.5px;">마꼼</p>
              </a>
            </td>
          </tr>

          <!-- 본문 -->
          <tr>
            <td style="padding:30px;">
              <p style="margin:0 0 8px; color:#333; font-size:20px; font-weight:700;">🎉 구독을 시작했어요!</p>
              <p style="margin:0 0 12px; color:#666; font-size:14px; line-height:1.6;">
                설정하신 조건에 맞는 마라톤 대회 정보를 정기적으로 보내드릴게요.<br>
                이런 형식으로 알림을 받아보실 수 있어요.
              </p>

              <!-- 이벤트 목록 -->
              <div th:each="event : ${events}">
                <div style="border:1px solid #e0e7ff; border-radius:6px; padding:12px 16px; margin-bottom:8px;">
                  <table width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="color:#312e81; font-size:14px; font-weight:700;" th:text="${event.title}">대회명</td>
                      <td align="right" style="white-space:nowrap;">
                        <a th:href="${event.linkUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block; padding:4px 12px; background:#6366f1; color:#ffffff; font-size:12px; font-weight:600; text-decoration:none; border-radius:4px;">대회 사이트</a>
                      </td>
                    </tr>
                  </table>
                  <p style="margin:5px 0 0; color:#666; font-size:12px;">
                    <strong>대회일:</strong> <span th:text="${#temporals.format(event.eventDate, 'yyyy.MM.dd')}">2026.04.20</span>
                    <span style="color:#c7d2fe; margin:0 6px;">|</span>
                    <strong>지역:</strong> <span th:text="${event.region}">수도권</span>
                    <span style="color:#c7d2fe; margin:0 6px;">|</span>
                    <strong>코스:</strong> <span th:text="${#strings.listJoin(event.distances, ', ')}">10K, 하프</span>
                  </p>
                  <p style="margin:3px 0 0; color:#999; font-size:12px;">
                    <strong style="color:#888;">신청기간:</strong>
                    <span th:text="${#temporals.format(event.regStartDate, 'yyyy.MM.dd')}">2026.03.01</span>
                    ~
                    <span th:text="${event.regEndDate != null ? #temporals.format(event.regEndDate, 'yyyy.MM.dd') : '미정'}">2026.04.01</span>
                  </p>
                </div>
              </div>

              <p style="margin:0; color:#666; font-size:13px; line-height:1.6;">
                수신 조건(요일, 시간, 지역, 거리)은 마꼼 서비스에서 언제든지 변경하실 수 있어요.
              </p>
            </td>
          </tr>

          <!-- 푸터 -->
          <tr>
            <td style="background:#f9f9f9; padding:20px 40px; border-top:1px solid #eee;">
              <p style="margin:0; color:#aaa; font-size:12px; line-height:1.6;">
                수신 설정 변경 또는 구독 해지는 <a href="https://maggom.com" target="_blank" rel="noopener noreferrer" style="color:#aaa; text-decoration:underline;">마꼼</a>에서 가능합니다.<br>
                본 메일은 발신 전용입니다.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
