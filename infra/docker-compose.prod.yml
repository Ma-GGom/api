name: maggom-server

services:
  postgres:
    image: postgres:17
    container_name: maggom-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - maggom-postgres-data:/var/lib/postgresql/data
    restart: always

  app:
    image: ghcr.io/ma-ggom/backend:latest
    container_name: maggom-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SES_SMTP_USERNAME: ${SES_SMTP_USERNAME}
      SES_SMTP_PASSWORD: ${SES_SMTP_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always

volumes:
  maggom-postgres-data:
