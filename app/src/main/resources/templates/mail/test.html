<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테스트 메일</title>
</head>
<body style="margin:0; padding:0; background:#f5f5f5; font-family:'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="500" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <!-- 헤더 -->
          <tr>
            <td style="background:#6366f1; padding:0;">
              <a href="https://maggom.com" target="_blank" rel="noopener noreferrer" style="display:block; padding:20px 40px; text-decoration:none; cursor:pointer;">
                <p style="margin:0; color:#ffffff; font-size:20px; font-weight:700; letter-spacing:-0.5px;">마꼼</p>
                <p style="margin:6px 0 0; color:#c7d2fe; font-size:13px;">관리자 테스트 발송 메일</p>
              </a>
            </td>
          </tr>

          <!-- 본문 -->
          <tr>
            <td style="padding:30px;">
              <p style="margin:0 0 8px; color:#333; font-size:20px; font-weight:700;">테스트 메일 발송 확인</p>
              <p style="margin:0 0 12px; color:#666; font-size:14px; line-height:1.6;">
                관리자 패널에서 요청한 테스트 메일입니다.
              </p>

              <div style="background:#eef2ff; border-left:4px solid #6366f1; border-radius:4px; padding:16px 20px; margin-bottom:24px;">
                <p style="margin:0 0 6px; color:#666; font-size:12px; text-transform:uppercase; letter-spacing:1px;">템플릿 타입</p>
                <p style="margin:0; color:#312e81; font-size:18px; font-weight:700;" th:text="${templateType}">NOTIFICATION</p>
              </div>

              <p style="margin:0; color:#999; font-size:13px; line-height:1.6;">
                이메일 발송 설정(SES, SMTP)이 정상적으로 동작하고 있습니다.
              </p>
            </td>
          </tr>

          <!-- 푸터 -->
          <tr>
            <td style="background:#f9f9f9; padding:20px 40px; border-top:1px solid #eee;">
              <p style="margin:0; color:#aaa; font-size:12px; line-height:1.6;">
                본 메일은 <a href="https://maggom.com" target="_blank" rel="noopener noreferrer" style="color:#aaa; text-decoration:underline;">마꼼</a> 관리자 패널에서 발송된 테스트 메일입니다.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
