name: maggom-server

services:
  postgres:
    image: postgres:17
    container_name: maggom-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - maggom-postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  maggom-postgres-data:
