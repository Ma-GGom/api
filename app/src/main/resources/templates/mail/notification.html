<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마라톤 대회 알림</title>
  <style>
    /* 휴대폰에서 1열이 되면 카드를 화면 폭에 맞춘다. (지원하지 않는 클라이언트는 272px 카드로 보인다) */
    @media only screen and (max-width: 600px) {
      .event-card { max-width: 100% !important; margin: 0 0 8px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#f5f5f5; font-family:'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <!-- 헤더 -->
          <tr>
            <td style="background:#6366f1; padding:0;">
              <a href="https://maggom.com" target="_blank" rel="noopener noreferrer" style="display:block; padding:20px 40px; text-decoration:none; cursor:pointer;">
                <p style="margin:0; color:#ffffff; font-size:20px; font-weight:700; letter-spacing:-0.5px;">마꼼</p>
              </a>
            </td>
          </tr>

          <!-- 본문 -->
          <tr>
            <td style="padding:28px 20px;">
              <p style="margin:0 0 8px 4px; color:#333; font-size:20px; font-weight:700;">🏃 마라톤 대회 목록</p>
              <p style="margin:0 0 4px 4px; color:#666; font-size:14px; line-height:1.6;">
                구독하신 조건에 맞는 대회 <strong th:text="${#lists.size(events)}">20</strong>개를 알려드립니다.
              </p>
              <p style="margin:0 0 14px 4px; color:#9ca3af; font-size:12px; line-height:1.6;">
                접수 상태는 수집 시점 기준이에요. 선착순 조기 마감 여부는 대회 사이트에서 꼭 확인해 주세요.
              </p>

              <!-- 이벤트 목록 (넓은 화면 2열, 휴대폰 1열) -->
              <div th:replace="~{mail/fragments/event-cards :: eventCards(${events})}"></div>
            </td>
          </tr>

          <!-- 푸터 -->
          <tr>
            <td style="background:#f9f9f9; padding:20px 40px; border-top:1px solid #eee;">
              <p style="margin:0; color:#aaa; font-size:12px; line-height:1.6;">
                수신 설정 변경은 <a href="https://maggom.com" target="_blank" rel="noopener noreferrer" style="color:#aaa; text-decoration:underline;">마꼼</a>에서 가능합니다.<br>
                이 메일을 더 받고 싶지 않으시면 <a th:href="${unsubscribeUrl}" target="_blank" rel="noopener noreferrer" style="color:#aaa; text-decoration:underline;">구독 해지</a>를 눌러주세요.<br>
                본 메일은 발신 전용입니다.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
