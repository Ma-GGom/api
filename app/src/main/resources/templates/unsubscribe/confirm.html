<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마꼼 구독 해지</title>
</head>
<body style="margin:0; padding:0; background:#f5f5f5; font-family:'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="500" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <tr>
            <td style="background:#6366f1; padding:0;">
              <a href="https://maggom.com" target="_blank" rel="noopener noreferrer" style="display:block; padding:20px 40px; text-decoration:none; cursor:pointer;">
                <p style="margin:0; color:#ffffff; font-size:20px; font-weight:700; letter-spacing:-0.5px;">마꼼</p>
              </a>
            </td>
          </tr>

          <tr>
            <td style="padding:40px 30px; text-align:center;">
              <p style="margin:0 0 12px; color:#333; font-size:20px; font-weight:700;">구독을 해지할까요?</p>
              <p style="margin:0 0 28px; color:#666; font-size:14px; line-height:1.6;">
                해지하면 더 이상 마라톤 대회 알림 메일을 받지 못합니다.<br>
                수신 요일이나 지역만 바꾸고 싶다면 마꼼에서 설정을 변경해 주세요.
              </p>

              <form method="post" th:action="${actionPath}" style="margin:0;">
                <input type="hidden" name="token" th:value="${token}">
                <button type="submit"
                        style="display:inline-block; padding:12px 28px; background:#ef4444; color:#ffffff; font-size:14px; font-weight:600; border:0; border-radius:6px; cursor:pointer;">
                  구독 해지하기
                </button>
              </form>

              <p style="margin:20px 0 0;">
                <a href="https://maggom.com" target="_blank" rel="noopener noreferrer"
                   style="color:#6366f1; font-size:14px; text-decoration:none; font-weight:600;">
                  그냥 두기
                </a>
              </p>
            </td>
          </tr>

          <tr>
            <td style="background:#f9f9f9; padding:20px 40px; border-top:1px solid #eee;">
              <p style="margin:0; color:#aaa; font-size:12px; line-height:1.6;">
                이 페이지에서는 아직 해지되지 않았습니다. 위 버튼을 눌러야 처리됩니다.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
